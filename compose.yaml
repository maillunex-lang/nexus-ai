name: nexus-ai-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nexus
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
      - ./db/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/nexus
      NEXUS_MCP_INTERNAL_TOKEN: ${NEXUS_MCP_INTERNAL_TOKEN:?Set internal MCP token in .env}
    volumes:
      - /opt/basheco/client:/projects/basheco:ro
      - /opt/watermmo:/projects/watermmo:ro
      - /opt/fermabash/project:/projects/agroempire:ro
      - /opt/nexus-ai/godot-workspaces:/godot-workspaces:ro
      - /opt/nexus-ai/godot-queue:/godot-queue:rw
      - /opt/nexus-ai/secrets/meshy-api-key:/run/secrets/meshy_api_key:ro
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:4189:80"
    depends_on:
      - api
volumes:
  nexus_pgdata:
