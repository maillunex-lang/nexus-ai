server {
    listen 80;
    server_name _;
    location /api/ {
        proxy_pass http://api:8000;
    }
    # MCP is loopback-only at the Docker host level. Do not expose until OAuth.
    location /mcp/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location = /mcp {
        return 308 /mcp/;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
